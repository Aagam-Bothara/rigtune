name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # The direct runtime dependencies at the versions the suite last passed with (constraints/core.txt).
      - run: pip install -c constraints/core.txt -e ".[dev]"
      - run: ruff check rigtune tests benchmarks
      # Type-checked: the two serving modules added with the opt-in limits, not the codebase as a whole.
      - run: python -m mypy --follow-imports=skip --ignore-missing-imports rigtune/serve/limits.py rigtune/serve/streaming.py
      - run: pytest

  # The same suite on the newest releases the pyproject bounds allow, so a dependency release that breaks rigtune
  # shows here before it reaches users, while the pinned job above stays reproducible.
  test-unpinned:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install --upgrade -e ".[dev]"
      - run: pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      # The bundled eval set is package data, which a wheel drops unless pyproject.toml lists it.
      - run: python -m zipfile -l dist/*.whl | grep -q "rigtune/data/gsm8k.jsonl"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The real image builds on vllm/vllm-openai (tens of GB); a slim base checks the Dockerfile's own steps.
      - run: docker build --build-arg BASE_IMAGE=python:3.12-slim -t rigtune-ci .
      - run: docker run --rm rigtune-ci --help
      - run: docker run --rm rigtune-ci workloads
