name: release

# Publishing a GitHub release builds the package and uploads it to PyPI through trusted publishing: PyPI
# trusts this workflow, so no API token is stored anywhere. One-time setup is in CONTRIBUTING.md.
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      # twine check reads only the metadata: rigtune 0.2.0 reached PyPI as a wheel with no code in it, built from
      # a commit that had deleted the old package without adding the new one. Install the wheel and run it.
      - name: Check the wheel contains the package and runs
        run: |
          python -m zipfile -l dist/*.whl | grep -q "rigtune/cli.py"
          pip install dist/*.whl
          cd "$RUNNER_TEMP" && rigtune --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
