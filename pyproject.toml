[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rigtune"
version = "0.3.0"
description = "Autotuner for LLM serving: finds which engine (vLLM, SGLang or llama.cpp) and which settings run your model fastest on your GPU and your traffic, then serves the winner"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "MIT"}
authors = [{name = "Aagam Sachin Bothara", email = "mweeb19@gmail.com"}]
keywords = ["llm", "inference", "vllm", "llama.cpp", "serving", "autotuning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    # Imported directly by rigtune.serve (streaming, limits); fastapi brings both, but its bounds are its own.
    # The lower bounds are the starlette fastapi 0.110 required and the anyio that starlette required.
    "starlette>=0.36.3",
    "anyio>=3.6.2,<5",
    "uvicorn>=0.29",
    "psutil>=5.9",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
nvml = ["nvidia-ml-py>=12.535.133"]
# The reasoning harness (rigtune.reasoning): MATH's Parquet files, and math-verify to compare LaTeX answers as maths.
reason = ["pyarrow>=14", "math-verify[antlr4_13_2]>=0.7"]
# llmtrace, the GPU tracer rigtune prefers for telemetry (it falls back to pynvml, then psutil), is not an
# extra: PyPI refuses packages with git dependencies, and "llmtrace" on PyPI is an unrelated project. Install
# it from git: pip install "llmtrace @ git+https://github.com/Aagam-Bothara/llmtrace.git"
# ruff is pinned: its default rules change between releases (0.16 added pyupgrade), so an unpinned
# linter passed locally and failed in CI on the same code.
# mypy is pinned for the same reason; CI runs it on the serving modules rigtune.serve.limits and .streaming only.
dev = ["pytest>=7.0", "pytest-asyncio>=0.23", "ruff==0.15.0", "mypy==1.19.1"]

[project.urls]
Homepage = "https://github.com/Aagam-Bothara/rigtune"
Documentation = "https://github.com/Aagam-Bothara/rigtune/blob/main/docs/usage.md"
Benchmarks = "https://github.com/Aagam-Bothara/rigtune/blob/main/docs/benchmarks.md"
Issues = "https://github.com/Aagam-Bothara/rigtune/issues"

[project.scripts]
rigtune = "rigtune.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["rigtune*"]

# The bundled eval set and its licence, and the expert rows. rigtune/data is not a package, so without this
# the wheel leaves them out, and `--eval-set gsm8k` or `compare --expert` would work from a checkout and fail
# once installed.
[tool.setuptools.package-data]
rigtune = ["data/*.jsonl", "data/*.txt", "data/*.json", "data/conformance/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "real_head_search: run rigtune.headsearch itself, not the empty search every other test sees",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]  # explicit, so the rule set does not move with ruff's defaults
